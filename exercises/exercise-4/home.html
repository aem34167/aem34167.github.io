<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png"><!-- 180×180 -->
    <style>
        #primary-nav ul {
            padding-left: 0;
            }
#primary-nav a { 
  background-color: cornflowerblue;
  display: block; 
  padding: 1em;
} 
        #primary-nav li { 
  list-style: none; 
  display: inline-block;
        }
@media (max-width: 767px) { 
  #primary-nav li { 
  display:block; 
  .inner {overflow: hidden;}
    #toggle-nav-btn {
        display: block;
    }
    body.nav-open #primary-nav {
      grid-template-rows: 1fr;
    }
    .inner {
      overflow: hidden;
    }
    #toggle-nav-btn {
      display: block; /* display button beneath breakpoint */
    }
}
}
#toggle-nav-btn {
    display: none;
    position: absolute;
    right: 1em;
    top: 1em;
  }
 
    </style>
</head>
<body>
<nav id="primary-nav">
    <div class="inner">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
   <section>
    <h1>Exercise 4</h1>
    <p>This is the main page, welcome to this site. </p>
<script>
window.onload = () => {
    const toggleNavBtn = document.getElementById('toggle-nav-btn');
    toggleNavBtn.innerHTML = '&#9776;';
    // Tell button to do something on click
      toggleNavBtn.addEventListener('click', () => {
        // toggle the body's class attribute
        document.body.classList.toggle('nav-open');
        toggleNavBtn.innerHTML = document.body.classList.contains('nav-open')
          ? '&#x2715'
          : '&#9776;';
      });
};
</script></Code>
<button id="toggle-nav-btn"></button>
</body>

</html>
