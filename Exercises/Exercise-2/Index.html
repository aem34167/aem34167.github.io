<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
    .box {
        position: relative;
        z-index: 0;
        width: 800px;
        height: 800px;
    }
    .box1 {
        width: 200px;
        height: 200px;
        background-color: rgb(0, 135, 194);
        position: relative;
        z-index: 1;
    
    }
    .box2 {
        width: 200px;
        height: 200px;
        top: -250px;
        left: -60%;
        background-color: rgb(161, 10, 10);
        z-index: 2;
        position: absolute;
    }
    .box3 {
        width: 200px;
        height: 200px;
        top: -500px;
        left: -120%;
        background-color: rgb(21, 112, 21);
        z-index: 3;
        position: absolute;
    }   
    </style>
</head>
<body>
    <h1>Exercise 2</h1>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
