
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Assignment 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
      body {
        background-color: grey;
        margin: 0 auto;
        font-family: Helvetica, sans-serif;
      }

      #site-header {
        width: 1440px;
        margin: 20px auto;
        text-align: center;
      }

      #footer {
        width: 1440px;
        text-align: center;
        align-items: center;
        margin: auto;
      }

      #site-header .row,
      #footer .row {
        display: flex;
        background-color: white;
        align-items: center;
        text-align: center;
        width: 100%;
      }

      #content {
        width: 1440px;
        margin: 5px auto;
        background-color: beige;
        text-align: center;
        border: 20px solid white; border-radius: 20px;
      }

      .row {
        display: flex;
        background-color: white;
        height: 100px;
      }

      .col-a,
      .col-b,
      .col-50,
      .col-33,
      .col-100 {
        padding: 25px;
        border: 2px solid black;
      }

      #content .col-a {
        flex: 1;
        color: black;
      }

      #content .col-b {
        width: 200px;
      }

      .col-50 {
        width: 50%;
      }

      .col-33 {
        width: 33.333%;
      }

      .col-100 {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header id="site-header">
      <div class="row">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>
    <main>
      <div id="content">
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
      </div>

      <footer id="footer">
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </footer>
    </main>
  </body>
</html>
